# CI gate - the blocking, deterministic, FREE checks (gstack evals.yml + skill-docs.yml analog).
# After dependency installation, checks run offline without an API key: SKILL.md freshness,
# multi-host generation, the full test suite, and worked-example validation. Runs on Ubuntu AND Windows (APA
# targets law-firm Windows laptops). The paid LLM-judge evals live in periodic-evals.yml.
name: gate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  gate:
    name: free gate (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install locked workspace dependencies
        run: npm ci

      - name: SKILL.md freshness (templates + resolvers must match committed SKILL.md)
        run: node scripts/gen-skill-docs.mjs --check

      - name: Multi-host generation (exercises HostConfig + non-suppressible safety denylist)
        run: node scripts/gen-skill-docs.mjs --all-hosts

      - name: Skill graph generated-doc freshness
        run: node packages/apa-skillgraph/cli.mjs docs --check

      - name: Syntax sweep
        run: npm run syntax

      - name: Source registry drift check
        run: npm run sources:check

      - name: Full test suite (offline; no API key required)
        run: npm test

      - name: Distribution isolation matrix (public tarballs only)
        run: npm run distribution:check

      - name: Offline benchmark suite
        run: npm run benchmark

      - name: Prior-art recall score gate
        run: npm run score:prior-art-search

      - name: Coverage summary (offline, blocking floors)
        run: npm run coverage

      - name: Core CLI smoke checks (offline)
        run: npm run smoke

      - name: Validate worked example - minimal
        run: node packages/apa-validate/validate.mjs examples/minimal-patent-artifact

      - name: Validate worked example - full lifecycle
        run: node packages/apa-validate/validate.mjs examples/full-lifecycle-artifact

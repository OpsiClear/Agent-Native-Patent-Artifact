# Periodic LLM-judge drafting-quality evals (gstack evals-periodic.yml analog) - PAID.
# Runs apa-eval LIVE against the worked examples on a weekly schedule (and on demand). Needs the
# ANTHROPIC_API_KEY repo secret; skips cleanly when it is absent (e.g. on forks), so it never
# red-lines a PR. A completed paid run is a scheduled quality gate: regressions fail the workflow
# after its evidence has been persisted and uploaded.
name: periodic-evals

on:
  schedule:
    - cron: "0 7 * * 1" # Mondays 07:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  evals:
    name: apa-eval (live, paid)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Freeze clean eval cache fingerprint
        id: eval-cache
        shell: bash
        run: |
          echo "fingerprint=${{ hashFiles('packages/apa-eval/**/*.mjs', 'examples/minimal-patent-artifact/**', 'examples/full-lifecycle-artifact/**') }}" >> "${GITHUB_OUTPUT}"

      - name: Restore prior eval baselines
        uses: actions/cache/restore@v4
        with:
          path: .eval-runs
          key: eval-runs-${{ runner.os }}-${{ github.ref_name }}-claude-opus-4-8-${{ steps.eval-cache.outputs.fingerprint }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            eval-runs-${{ runner.os }}-${{ github.ref_name }}-claude-opus-4-8-${{ steps.eval-cache.outputs.fingerprint }}-

      - name: LLM-judge evals on the worked examples
        id: evals
        continue-on-error: true
        shell: bash
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          APA_JUDGE_MODEL: claude-opus-4-8
        run: |
          if [ -z "${ANTHROPIC_API_KEY:-}" ]; then
            echo "ANTHROPIC_API_KEY not set - skipping paid evals (expected on forks)."
            echo "skipped=true" >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          status=0
          node packages/apa-eval/cli.mjs --matter examples/minimal-patent-artifact --out .eval-runs || status=$?
          node packages/apa-eval/cli.mjs --matter examples/full-lifecycle-artifact --out .eval-runs || status=$?
          exit "${status}"

      - name: Save current eval baselines
        # A failed candidate stays in the uploaded artifact for diagnosis but must never become the
        # next comparison baseline.
        if: steps.evals.outcome == 'success' && steps.evals.outputs.skipped != 'true'
        uses: actions/cache/save@v4
        with:
          path: .eval-runs
          key: eval-runs-${{ runner.os }}-${{ github.ref_name }}-claude-opus-4-8-${{ steps.eval-cache.outputs.fingerprint }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Upload eval run records
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-runs
          path: .eval-runs/
          if-no-files-found: ignore

      - name: Enforce paid eval result
        if: always() && steps.evals.outcome == 'failure'
        shell: bash
        run: |
          echo "One or more paid evals failed or crossed the regression gate."
          exit 1
